<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>宗师杯 · 赛事后台</title><link rel="stylesheet" href="/entry.css"><script defer src="/staff.js"></script></head><body><header><a class="brand" href="/"><span>宗</span>宗师杯</a><a href="/">参赛入口</a></header><main class="panel"><h1>赛事后台</h1><p>主办方可查看报名、匿名调研、队伍空档和已排小组。</p><a class="button-link" href="/signin-with-chatgpt?return_to=%2Fadmin" target="_top">主办方登录</a><details><summary>使用赛务密钥</summary><label>赛务密钥<input type="password" id="token" autocomplete="off"></label></details><button id="load">读取赛事记录</button><p id="status" role="status"></p><section id="data" hidden><h2>报名与散人组队</h2><div id="players"></div><p>勾选五名待组队选手，然后指定一位队长。队长之后凭个人报名回执查看队名、入队码并填写时段。</p><label>队名<input id="teamName" maxlength="40"></label><label>队长<select id="captain"></select></label><button id="assign">组成一队</button><h2>队伍时段与四队分组</h2><div id="teams"></div><label>每轮预留<select id="duration"><option value="120">120 分钟（默认，含余量）</option><option value="90">90 分钟（仅在实测后使用）</option></select></label><button id="suggest">检查选中四队的交集</button><p id="suggestText"></p><button id="makePool" hidden>确认这三轮及两场并行对阵</button><h2>已排小组</h2><div id="pools"></div><h2>匿名调研</h2><div id="surveys"></div><button id="export">导出私有 JSON</button></section></main></body></html>
